server {
  listen 80;
  root /usr/share/nginx/html;

  # Vite fingerprints assets, while remoteEntry.js stays uncached.
  location ^~ /remotes/supplier/assets/ {
    rewrite ^/remotes/supplier/(.*)$ /$1 break;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ^~ /remotes/supplier/ {
    rewrite ^/remotes/supplier/(.*)$ /$1 break;
    try_files $uri =404;
  }

  location = /api/supplier {
    proxy_pass http://supplier-api:3000/api/supplier;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
  }

  location /api/supplier/ {
    proxy_pass http://supplier-api:3000/api/supplier/;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
  }

  location = /healthz { default_type text/plain; return 200 "ok\n"; }
  location / { try_files $uri $uri/ /index.html; }
}
