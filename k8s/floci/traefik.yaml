apiVersion: v1
kind: ServiceAccount
metadata: { name: relay-traefik, namespace: relay }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: relay-traefik }
rules:
  - apiGroups: ['']
    resources: [services, secrets, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: relay-traefik }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: relay-traefik }
subjects: [{ kind: ServiceAccount, name: relay-traefik, namespace: relay }]
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata: { name: traefik }
spec: { controller: traefik.io/ingress-controller }
---
apiVersion: v1
kind: Service
metadata: { name: relay-traefik, namespace: relay }
spec:
  type: NodePort
  selector: { app: relay-traefik }
  ports: [{ name: web, port: 80, targetPort: web, nodePort: 30080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: relay-traefik, namespace: relay }
spec:
  replicas: 1
  selector: { matchLabels: { app: relay-traefik } }
  template:
    metadata: { labels: { app: relay-traefik } }
    spec:
      serviceAccountName: relay-traefik
      containers:
        - name: traefik
          securityContext: { allowPrivilegeEscalation: false }
          image: traefik:v3.4
          args: [--providers.kubernetesingress=true, --providers.kubernetesingress.ingressclass=traefik, --entrypoints.web.address=:8000]
          ports: [{ name: web, containerPort: 8000 }]
          readinessProbe: { tcpSocket: { port: web }, periodSeconds: 5 }
