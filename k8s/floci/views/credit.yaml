# Tool: ChatGPT (model: GPT-6.1 Terra), date: 2026-11-06
# Scope: Generated implementation of local credit database inspection view
# Author review: Verified correctness and that local prisma view of credit database works.

apiVersion: v1
kind: Service
metadata: { name: relay-credit-prisma-studio, namespace: relay }
spec: { selector: { app: relay-credit-prisma-studio }, ports: [{ port: 5555, targetPort: web }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: relay-credit-prisma-studio, namespace: relay }
spec:
  replicas: 1
  selector: { matchLabels: { app: relay-credit-prisma-studio } }
  template:
    metadata: { labels: { app: relay-credit-prisma-studio } }
    spec:
      containers:
        - name: studio
          securityContext: { allowPrivilegeEscalation: false }
          image: STUDIO_API_IMAGE
          imagePullPolicy: IfNotPresent
          command: [npx, prisma, studio, --schema=credit-service/backend/prisma/schema.prisma, --hostname=0.0.0.0, --port=5555]
          ports: [{ name: web, containerPort: 5555 }]
          env:
            - { name: NODE_OPTIONS, value: "--max-old-space-size=614" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: relay-runtime, key: CREDIT_DATABASE_URL } }
          readinessProbe: { tcpSocket: { port: web }, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 768Mi } }
