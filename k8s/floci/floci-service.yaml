apiVersion: v1
kind: Service
metadata: { name: floci-local, namespace: relay }
spec:
  ports: [{ name: http, port: 4566, targetPort: 4566 }]
---
apiVersion: v1
kind: Endpoints
metadata: { name: floci-local, namespace: relay }
subsets:
  - addresses: [{ ip: FLOCI_DOCKER_IP }]
    ports: [{ name: http, port: 4566 }]
