apiVersion: v1
kind: Service
metadata: { name: supplier-api, namespace: relay }
spec: { selector: { app: supplier-api }, ports: [{ port: 3000, targetPort: http }] }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: user-api, namespace: relay }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: errand-api, namespace: relay }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: credit-api, namespace: relay }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: supplier-api, namespace: relay }
spec:
  replicas: 1
  selector: { matchLabels: { app: supplier-api } }
  template:
    metadata: { labels: { app: supplier-api } }
    spec:
      containers:
        - name: api
          image: IMAGE_SUPPLIER_API
          command: [node, dist/app.js]
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: DB_HOST, valueFrom: { secretKeyRef: { name: relay-runtime, key: SUPPLIER_DB_HOST } } }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: relay }
            - { name: DB_USER, value: relay }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: relay-runtime, key: SUPPLIER_DB_PASSWORD } } }
            - { name: USER_API_URL, value: "http://user-api:3000" }
          envFrom: [{ configMapRef: { name: relay-runtime } }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: user-api, namespace: relay }
spec: { selector: { app: user-api }, ports: [{ port: 3000, targetPort: http }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: user-api, namespace: relay }
spec:
  replicas: 1
  selector: { matchLabels: { app: user-api } }
  template:
    metadata: { labels: { app: user-api } }
    spec:
      serviceAccountName: user-api
      containers:
        - name: api
          image: IMAGE_USER_API
          command: [node, --import, tsx, user-service/backend/dist/server.js]
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: relay-runtime, key: USER_DATABASE_URL } } }
          envFrom: [{ configMapRef: { name: relay-runtime } }, { secretRef: { name: relay-runtime } }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15 }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
