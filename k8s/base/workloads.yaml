apiVersion: v1
kind: Service
metadata: { name: errand-notification, namespace: relay }
spec: { selector: { app: errand-notification }, ports: [{ port: 3010, targetPort: http }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: errand-notification, namespace: relay }
spec:
  replicas: 1
  selector: { matchLabels: { app: errand-notification } }
  template:
    metadata: { labels: { app: errand-notification } }
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: notification
          securityContext: { allowPrivilegeEscalation: false }
          image: IMAGE_ERRAND_NOTIFICATION
          ports: [{ name: http, containerPort: 3010 }]
          # Keep serving while ingress removes this terminating pod from its endpoints.
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          env:
            - { name: NODE_OPTIONS, value: "--max-old-space-size=614" }
            - { name: PORT, value: "3010" }
          envFrom: [{ configMapRef: { name: relay-runtime } }, { secretRef: { name: relay-runtime } }]
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5, failureThreshold: 24 }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 15 }
          resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { cpu: 500m, memory: 768Mi } }
