apiVersion: v1
kind: Service
metadata: { name: redis, namespace: relay }
spec: { selector: { app: redis }, ports: [{ port: 6379, targetPort: redis }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: relay }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: IMAGE_REDIS
          securityContext: { allowPrivilegeEscalation: false }
          command: [redis-server, --appendonly, 'yes', --save, '', --maxmemory, 360mb, --maxmemory-policy, allkeys-lru]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe: { exec: { command: [redis-cli, ping] }, initialDelaySeconds: 3 }
          livenessProbe: { exec: { command: [redis-cli, ping] }, initialDelaySeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { cpu: 200m, memory: 512Mi } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, emptyDir: {} }]
---
