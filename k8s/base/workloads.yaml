apiVersion: v1
kind: Service
metadata: { name: host, namespace: relay }
spec: { selector: { app: host }, ports: [{ port: 80, targetPort: http }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: host, namespace: relay }
spec:
  replicas: 2
  selector: { matchLabels: { app: host } }
  template:
    metadata: { labels: { app: host } }
    spec:
      containers:
        - name: host
          securityContext: { allowPrivilegeEscalation: false }
          image: IMAGE_HOST
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 128Mi } }
