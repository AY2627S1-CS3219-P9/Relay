# Apply after runtime-secret.yaml exists and before workloads.yaml. Each Job runs
# the Prisma migration exactly once; scaled application Pods do not run migrations.
apiVersion: batch/v1
kind: Job
metadata: { name: supplier-schema, namespace: relay }
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema
          image: postgres:16-alpine
          command: [sh, -c, 'psql "$SUPPLIER_DATABASE_URL" -f /schema/schema.sql']
          env:
            - { name: SUPPLIER_DATABASE_URL, valueFrom: { secretKeyRef: { name: relay-runtime, key: SUPPLIER_DATABASE_URL } } }
          volumeMounts: [{ name: schema, mountPath: /schema, readOnly: true }]
      volumes: [{ name: schema, configMap: { name: supplier-schema } }]
---
apiVersion: batch/v1
kind: Job
metadata: { name: user-migrate, namespace: relay }
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: IMAGE_USER_API
          command: [sh, -c, 'npx prisma migrate deploy --schema=user-service/backend/prisma/schema.prisma']
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: relay-runtime, key: USER_DATABASE_URL } } }
---
