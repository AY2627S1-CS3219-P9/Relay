# Single-node demo broker. Its emptyDir is intentionally ephemeral.
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: relay }
spec:
  type: ClusterIP
  selector: { app: kafka }
  ports: [{ name: kafka, port: 9092, targetPort: kafka }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka, namespace: relay }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: kafka
          image: apache/kafka:4.0.0
          ports: [{ name: kafka, containerPort: 9092 }]
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "SASL_PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "SASL_PLAINTEXT://kafka.relay.svc.cluster.local:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "SASL_PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_SASL_ENABLED_MECHANISMS, value: "PLAIN" }
            - { name: KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL, value: "PLAIN" }
            - { name: KAFKA_OPTS, value: "-Djava.security.auth.login.config=/etc/kafka/secrets/broker_jaas.conf" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_NUM_PARTITIONS, value: "1" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
          volumeMounts:
            - { name: kafka-broker-config, mountPath: /etc/kafka/secrets, readOnly: true }
            - { name: kafka-data, mountPath: /var/lib/kafka/data }
          startupProbe:
            exec:
              command: [sh, -c, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --command-config /etc/kafka/secrets/client.properties --list >/dev/null 2>&1"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [sh, -c, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --command-config /etc/kafka/secrets/client.properties --list >/dev/null 2>&1"]
            periodSeconds: 20
            timeoutSeconds: 10
          resources: { requests: { cpu: 250m, memory: 768Mi }, limits: { cpu: "1", memory: 1536Mi } }
      volumes:
        - name: kafka-broker-config
          secret: { secretName: kafka-broker-config }
        - name: kafka-data
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata: { name: kafka-init, namespace: relay }
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: apache/kafka:4.0.0
          command:
            - sh
            - -ec
            - |
              for topic in user-events user-events-dlq errand-events errand-events-dlq; do
                /opt/kafka/bin/kafka-topics.sh \
                  --bootstrap-server kafka:9092 \
                  --command-config /etc/kafka/secrets/client.properties \
                  --create --if-not-exists --topic "$topic" \
                  --partitions 1 --replication-factor 1
              done
          volumeMounts:
            - { name: kafka-broker-config, mountPath: /etc/kafka/secrets, readOnly: true }
          resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
      volumes:
        - name: kafka-broker-config
          secret: { secretName: kafka-broker-config }
