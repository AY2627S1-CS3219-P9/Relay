apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: supplier-api, namespace: relay }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: supplier-api }
  minReplicas: 1
  maxReplicas: 4
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
---
