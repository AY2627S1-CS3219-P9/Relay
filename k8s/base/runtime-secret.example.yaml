# Copy this file to runtime-secret.yaml, replace every value, then apply it.
# runtime-secret.yaml is ignored by Git so credentials never enter the repository.
apiVersion: v1
kind: Secret
metadata:
  name: relay-runtime
  namespace: relay
type: Opaque
stringData:
  USER_DATABASE_URL: postgresql://relay:REPLACE@user-db:5432/relay?schema=public
  ERRAND_DATABASE_URL: postgresql://relay:REPLACE@errand-db:5432/relayerrand?schema=public
  CREDIT_DATABASE_URL: postgresql://relay:REPLACE@credit-db:5432/relay?schema=public
  SUPPLIER_DATABASE_URL: postgresql://relay:REPLACE@supplier-db:5432/relay
  SUPPLIER_DB_HOST: supplier-db
  SUPPLIER_DB_PASSWORD: REPLACE
  KAFKA_BROKERS: REPLACE_WITH_MSK_BOOTSTRAP_BROKERS
  AWS_REGION: REPLACE_WITH_AWS_REGION
  AWS_DEFAULT_REGION: REPLACE_WITH_AWS_REGION
  AWS_ENDPOINT_URL: https://cognito-idp.REPLACE_REGION.amazonaws.com
  COGNITO_ISSUER: REPLACE_WITH_COGNITO_ISSUER
  COGNITO_JWKS_URI: REPLACE_WITH_COGNITO_JWKS_URI
  COGNITO_CLIENT_ID: REPLACE_WITH_COGNITO_APP_CLIENT_ID
  COGNITO_USER_POOL_ID: REPLACE_WITH_COGNITO_USER_POOL_ID
  S3_ENDPOINT: REPLACE_WITH_S3_ENDPOINT
  S3_PUBLIC_ENDPOINT: REPLACE_WITH_S3_PUBLIC_ENDPOINT
  S3_REGION: REPLACE_WITH_AWS_REGION
  S3_BUCKET: REPLACE
  S3_FORCE_PATH_STYLE: "false"
