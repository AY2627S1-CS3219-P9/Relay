apiVersion: v1
kind: ConfigMap
metadata:
  name: relay-runtime
  namespace: relay
data:
  PORT: "3000"
  NODE_ENV: production
  # Temporary HTTP deployment; enable secure cookies when HTTPS is configured.
  COOKIE_SECURE: "true"
  AUTH_MODE: cognito
  KAFKA_REPLICATION_FACTOR: "3"
  KAFKA_PARTITION_COUNT: "12"
  KAFKA_MIN_IN_SYNC_REPLICAS: "2"
  KAFKA_TOPIC_USER_EVENTS: user-events
  KAFKA_TOPIC_USER_DLQ: user-events-dlq
  KAFKA_TOPIC_ERRAND_EVENTS: errand-events
  KAFKA_TOPIC_ERRAND_DLQ: errand-events-dlq
  KAFKA_AUTH_MODE: scram
  USER_API_TIMEOUT: "5000"
  CREDIT_ESTIMATION_API_URL: "http://credit-estimation-api:3005"
  SUPPLIER_TIMEZONE: Asia/Singapore
  SUPPLIER_SERVICE_TIMEOUT_MS: "5000"
  ERRAND_SERVICE_TIMEOUT_MS: "5000"
