server {
  listen 80;
  root /usr/share/nginx/html;

  location /remotes/supplier/ {
    proxy_pass http://supplier-frontend/;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location /remotes/user/ {
    proxy_pass http://user-frontend/;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location /remotes/errand/ {
    proxy_pass http://errand-frontend/;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location /remotes/credit/ {
    proxy_pass http://credit-frontend/;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location /api/user {
    proxy_pass http://user-api:3000;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
  }

  location /api/supplier {
    proxy_pass http://supplier-api:3000;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
  }

  location /api/errands {
    proxy_pass http://errand-api:3000;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
  }

  location /api/credit {
    proxy_pass http://credit-api:3000;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
