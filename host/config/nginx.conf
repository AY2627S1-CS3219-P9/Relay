server {
  listen 80;
  root /usr/share/nginx/html;

  # This name is resolved by Docker Compose today and by Kubernetes DNS when
  # the frontend is later exposed as a Service.
  # TODO(kubernetes): Keep these names aligned with the Kubernetes Service
  # names, or move these routes to the cluster Ingress configuration.
  location /remotes/supplier/ {
    proxy_pass http://supplier-frontend/;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location /remotes/user/ {
    proxy_pass http://user-frontend/;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location /remotes/order/ {
    proxy_pass http://order-frontend/;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location /remotes/credit/ {
    proxy_pass http://credit-frontend/;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
