server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker Compose routes through the host-published frontend ports. Kubernetes
  # should provide equivalent /remotes/* routes through its Ingress instead.
  location /remotes/supplier/ {
    proxy_pass http://host.docker.internal:5001/;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location /remotes/user/ {
    proxy_pass http://host.docker.internal:5002/;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location /remotes/order/ {
    proxy_pass http://host.docker.internal:5003/;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location /remotes/credit/ {
    proxy_pass http://host.docker.internal:5004/;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
