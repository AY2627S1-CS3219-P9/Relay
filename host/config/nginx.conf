map $http_x_forwarded_proto $relay_alb_forwarded_proto {
  default $scheme;
  https https;
  http http;
}



map $http_cloudfront_forwarded_proto $relay_forwarded_proto {
  default $relay_alb_forwarded_proto;
  https https;
  http http;
}
server {
  listen 80;
  root /usr/share/nginx/html;

  # Cognito returns access, ID, and refresh cookies together. Accept their
  # response headers and the combined Cookie header on later requests.
  large_client_header_buffers 4 16k;
  proxy_buffer_size 16k;
  proxy_buffers 4 16k;
  proxy_busy_buffers_size 32k;

  location /remotes/supplier/ {
    proxy_pass http://supplier-frontend;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location /remotes/user/ {
    proxy_pass http://user-frontend;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location /remotes/errand/ {
    proxy_pass http://errand-frontend;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location /remotes/credit/ {
    proxy_pass http://credit-frontend;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location /api/auth {
    proxy_pass http://user-auth-api:3000;
    proxy_set_header X-Forwarded-Proto $relay_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
  }

  location /api/user {
    proxy_pass http://user-api:3000;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
  }

  location /api/supplier {
    proxy_pass http://supplier-api:3000;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
  }

  location /api/errands {
    proxy_pass http://errand-api:3000;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
  }

  location /internal/errands {
    proxy_pass http://errand-api:3000;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
  }

  location /api/credit {
    proxy_pass http://credit-api:3000;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
  }

  location /api/notifications/stream {
    proxy_pass http://errand-notification:3010;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $relay_forwarded_proto;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 3600s;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # Vite fingerprints these filenames; browsers may keep each version.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
