services:
  kafka:
    image: apache/kafka:latest
    ports:
      - '9094:9094'
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    build: ./kafka
    environment:
      KAFKA_TOPIC_USER_REGISTERED: ${KAFKA_TOPIC_USER_REGISTERED:?Set KAFKA_TOPIC_USER_REGISTERED}
      KAFKA_TOPIC_USER_DELETED: ${KAFKA_TOPIC_USER_DELETED:?Set KAFKA_TOPIC_USER_DELETED}
      KAFKA_TOPIC_ERRAND_CONFIRMED: ${KAFKA_TOPIC_ERRAND_CONFIRMED:?Set KAFKA_TOPIC_ERRAND_CONFIRMED}
      KAFKA_TOPIC_ERRAND_CANCELLED: ${KAFKA_TOPIC_ERRAND_CANCELLED:?Set KAFKA_TOPIC_ERRAND_CANCELLED}
      KAFKA_TOPIC_ERRAND_EXPIRED: ${KAFKA_TOPIC_ERRAND_EXPIRED:?Set KAFKA_TOPIC_ERRAND_EXPIRED}
    depends_on:
      kafka:
        condition: service_healthy

  user-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - '5432:5432'
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relay -d relay']
      interval: 5s
      timeout: 5s
      retries: 10

  errand-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relay_errand
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    ports:
      - '5434:5432'
    volumes:
      - errand-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relay -d relay_errand']
      interval: 5s
      timeout: 5s
      retries: 10

  credit-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - '5435:5432'
    volumes:
      - credit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relay -d relay']
      interval: 5s
      timeout: 5s
      retries: 10

  # Each domain owns a frontend remote and, when implemented, its own API.
  # Keep the API private to this Compose network with `expose`, rather than
  # publishing its port. The host is the browser-facing API boundary.
  host:
    build:
      context: .
      dockerfile: host/Dockerfile
    ports:
      - '8080:80'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      supplier-frontend:
        condition: service_healthy
      supplier-api:
        condition: service_healthy
      user-frontend:
        condition: service_healthy
      errand-frontend:
        condition: service_healthy
      errand-api:
        condition: service_healthy
      credit-frontend:
        condition: service_healthy
      credit-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 5

    # TODO(kubernetes): Create a Deployment, Service, and external ingress or
    # LoadBalancer for this container. Add readiness/liveness probes using
    # /healthz and set resource requests/limits.

  supplier-frontend:
    build:
      context: .
      dockerfile: supplier-service/frontend/Dockerfile
    ports:
      - '5001:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      supplier-api:
        condition: service_healthy
    # TODO(kubernetes): Create a Deployment and ClusterIP Service. Replicas
    # can scale independently behind that Service.

  user-frontend:
    build:
      context: .
      dockerfile: user-service/frontend/Dockerfile
    ports:
      - '5002:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    # TODO(kubernetes): Create a Deployment and ClusterIP Service.
    # Add a health-checked user-api dependency when its API exists.

  errand-frontend:
    build:
      context: .
      dockerfile: errand-service/frontend/Dockerfile
    ports:
      - '5003:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      errand-api:
        condition: service_healthy
    # TODO(kubernetes): Create a Deployment and ClusterIP Service.
    # Add a health-checked errand-api dependency when its API exists.

  credit-frontend:
    build:
      context: .
      dockerfile: credit-service/frontend/Dockerfile
    ports:
      - '5004:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    # TODO(kubernetes): Create a Deployment and ClusterIP Service.
    # Add a health-checked credit-api dependency when its API exists.

  # Database services
  supplier-db:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./supplier-service/backend/src/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend service templates
  #
  # Copy and adapt one of these stanzas when implementing a service API.
  # Do not expose API ports to the host: other containers can reach an API by
  # its Compose service name (for example, http://supplier-api:3000).
  # Add the corresponding /api/<service>/ proxy route to host/nginx.conf so
  # browser code can use a relative URL such as /api/supplier/shops.
  #
  supplier-api:
    build:
      context: .
      dockerfile: supplier-service/backend/Dockerfile
    expose:
      - '3000'
    environment:
      PORT: '3000'
      DB_HOST: supplier-db
      DB_PORT: '5432'
      DB_NAME: relay
      DB_USER: postgres
      DB_PASSWORD: postgres
      USER_API_URL: 'http://user-api:3000'
      USER_API_TIMEOUT: '5000'
      USER_SERVICE_INTERNAL_TOKEN: local-internal-user-service-token
    depends_on:
      errand-api:
        condition: service_healthy
      supplier-db:
        condition: service_healthy
      user-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 10s
      timeout: 3s
      retries: 5
  #
  user-api:
    build:
      context: .
      dockerfile: user-service/backend/Dockerfile
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://relay:relay@user-postgres:5432/relay?schema=public
      MOCK_JWT_SECRET: local-development-only-secret
      MOCK_JWT_ISSUER: relay-user-service
      MOCK_JWT_AUDIENCE: relay-user-frontend
      S3_ENDPOINT: http://host.docker.internal:4566
      S3_PUBLIC_ENDPOINT: http://localhost:4566
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_BUCKET: relay-user-profile-images
      S3_FORCE_PATH_STYLE: 'true'
      INTERNAL_USER_SERVICE_TOKEN: local-internal-user-service-token
      KAFKA_TOPIC_USER_REGISTERED: ${KAFKA_TOPIC_USER_REGISTERED:?Set KAFKA_TOPIC_USER_REGISTERED}
      KAFKA_TOPIC_USER_DELETED: ${KAFKA_TOPIC_USER_DELETED:?Set KAFKA_TOPIC_USER_DELETED}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      user-postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 3s
      retries: 5
  #
  errand-api:
    build:
      context: .
      dockerfile: errand-service/backend/Dockerfile
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://relay:relay@errand-postgres:5432/relay_errand?schema=public
      USER_API_URL: http://user-api:3000
      USER_SERVICE_INTERNAL_TOKEN: local-internal-user-service-token
      ERRAND_SERVICE_TIMEOUT_MS: '5000'
    depends_on:
      errand-postgres:
        condition: service_healthy
      user-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 3s
      retries: 5
  #
  credit-api:
    build:
      context: .
      dockerfile: credit-service/backend/Dockerfile
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://relay:relay@credit-postgres:5432/relay?schema=public
      USER_API_URL: http://user-api:3000
      USER_API_TIMEOUT: '5000'
      USER_SERVICE_INTERNAL_TOKEN: local-internal-user-service-token
      KAFKA_TOPIC_USER_REGISTERED: ${KAFKA_TOPIC_USER_REGISTERED:?Set KAFKA_TOPIC_USER_REGISTERED}
      KAFKA_TOPIC_USER_DELETED: ${KAFKA_TOPIC_USER_DELETED:?Set KAFKA_TOPIC_USER_DELETED}
      KAFKA_TOPIC_ERRAND_CONFIRMED: ${KAFKA_TOPIC_ERRAND_CONFIRMED:?Set KAFKA_TOPIC_ERRAND_CONFIRMED}
      KAFKA_TOPIC_ERRAND_CANCELLED: ${KAFKA_TOPIC_ERRAND_CANCELLED:?Set KAFKA_TOPIC_ERRAND_CANCELLED}
      KAFKA_TOPIC_ERRAND_EXPIRED: ${KAFKA_TOPIC_ERRAND_EXPIRED:?Set KAFKA_TOPIC_ERRAND_EXPIRED}
    depends_on:
      credit-postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  user-postgres-data:
  errand-postgres-data:
  credit-postgres-data:
  kafka-data:
