services:
  user-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - '5432:5432'
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relay -d relay']
      interval: 5s
      timeout: 5s
      retries: 10

  # Each domain owns a frontend remote and, when implemented, its own API.
  # Keep the API private to this Compose network with `expose`, rather than
  # publishing its port. The host is the browser-facing API boundary.
  host:
    build:
      context: .
      dockerfile: host/Dockerfile
    ports:
      - '8080:80'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      supplier-frontend:
        condition: service_healthy
      supplier-api:
        condition: service_healthy
      user-frontend:
        condition: service_healthy
      order-frontend:
        condition: service_healthy
      credit-frontend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 5

    # TODO(kubernetes): Create a Deployment, Service, and external ingress or
    # LoadBalancer for this container. Add readiness/liveness probes using
    # /healthz and set resource requests/limits.

  supplier-frontend:
    build:
      context: .
      dockerfile: supplier-service/frontend/Dockerfile
    ports:
      - '5001:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      supplier-api:
        condition: service_healthy
    # TODO(kubernetes): Create a Deployment and ClusterIP Service. Replicas
    # can scale independently behind that Service.

  user-frontend:
    build:
      context: .
      dockerfile: user-service/frontend/Dockerfile
    ports:
      - '5002:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    # TODO(kubernetes): Create a Deployment and ClusterIP Service.
    # Add a health-checked user-api dependency when its API exists.

  order-frontend:
    build:
      context: .
      dockerfile: order-service/frontend/Dockerfile
    ports:
      - '5003:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    # TODO(kubernetes): Create a Deployment and ClusterIP Service.
    # Add a health-checked order-api dependency when its API exists.

  credit-frontend:
    build:
      context: .
      dockerfile: credit-service/frontend/Dockerfile
    ports:
      - '5004:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    # TODO(kubernetes): Create a Deployment and ClusterIP Service.
    # Add a health-checked credit-api dependency when its API exists.

  # Database services
  supplier-db:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./supplier-service/backend/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend service templates
  #
  # Copy and adapt one of these stanzas when implementing a service API.
  # Do not expose API ports to the host: other containers can reach an API by
  # its Compose service name (for example, http://supplier-api:3000).
  # Add the corresponding /api/<service>/ proxy route to host/nginx.conf so
  # browser code can use a relative URL such as /api/supplier/shops.
  #
  supplier-api:
    build:
      context: .
      dockerfile: supplier-service/backend/Dockerfile
    expose:
      - "3000"
    environment:
      PORT: "3000"
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_NAME: relay
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      supplier-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
  #
  user-api:
    build:
      context: .
      dockerfile: user-service/backend/Dockerfile
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://relay:relay@user-postgres:5432/relay?schema=public
      MOCK_JWT_SECRET: local-development-only-secret
      MOCK_JWT_ISSUER: relay-user-service
      MOCK_JWT_AUDIENCE: relay-user-frontend
      S3_ENDPOINT: http://host.docker.internal:4566
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_BUCKET: relay-user-profile-images
      S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      user-postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 3s
      retries: 5
  #
  # order-api:
  #   build:
  #     context: ./order-service/backend
  #   expose: ["3000"]
  #
  # credit-api:
  #   build:
  #     context: ./credit-service/backend
  #   expose: ["3000"]

volumes:
  user-postgres-data:
