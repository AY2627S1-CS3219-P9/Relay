services:
  floci-eks:
    build:
      context: .
      dockerfile: floci/eks/Dockerfile
    container_name: relay-floci-eks
    env_file:
      - .env.development
    environment:
      FLOCI_LOCAL_EKS: 'true'
      FLOCI_BASE_URL: http://localhost:4567
      FLOCI_SECURITY_EXTRA_CORS_ALLOWED_ORIGINS: http://localhost:9090
      FLOCI_SERVICES_EKS_MOCK: 'false'
      FLOCI_INIT_HOOKS_TIMEOUT_SECONDS: '600'
    user: root
    ports:
      - '4567:4566'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ['CMD-SHELL', 'test -f /app/data/ready && /usr/local/bin/healthcheck.sh']
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 600s
