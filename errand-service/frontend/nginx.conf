# Scope: Generated initial templeate and proxy routing 
# Author review: I validated correctness, and did debugging for accessing remotes through the proxy

server {
  listen 80;
  root /usr/share/nginx/html;
  # Vite fingerprints assets, while remoteEntry.js stays uncached.
  location ^~ /remotes/errand/assets/ {
    rewrite ^/remotes/errand/(.*)$ /$1 break;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ^~ /remotes/errand/ {
    rewrite ^/remotes/errand/(.*)$ /$1 break;
    try_files $uri =404;
  }
  location = /healthz { default_type text/plain; return 200 "ok\n"; }
  
  # Proxy notification stream to errand-notification service
  location /api/notifications/stream {
    proxy_pass http://errand-notification:3010/api/notifications/stream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 3600s;
  }
  
  location /api/errands {
    proxy_pass http://errand-api:3000/api/errands;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_request_headers on;
    proxy_set_header credentials "include";
  }
  
  location /api/credit {
    proxy_pass http://credit-api:3000/api/credit;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_request_headers on;
  }
  
  location / {
    try_files $uri $uri/ /index.html;
  }
}
