$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"email":"{{courierEmail}}","password":"{{password}}","passwordConfirmation":"{{password}}"}'
scripts:
  - type: beforeRequest
    code: |-
      const s=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      pm.collectionVariables.set('courierEmail','relay-courier-'+s+'@u.nus.edu');
      pm.collectionVariables.set('courierName','relaycourier'+s);
  - type: afterResponse
    code: pm.response.to.have.status(201);
settings: {}
order: 1000
