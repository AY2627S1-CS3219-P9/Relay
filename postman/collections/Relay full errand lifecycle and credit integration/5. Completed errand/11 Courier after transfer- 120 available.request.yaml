$kind: http-request
name: "11 Courier after transfer: 120 available"
description: ""
url: "{{baseUrl}}/api/credit"
method: GET
headers:
  Cookie: "{{courierCookie}}"
scripts:
  - type: beforeRequest
    code: |-
      const selectedSession=pm.collectionVariables.get('courierCookie');
      if(typeof selectedSession!=='string'||!/^relay_access=[^;]+; relay_id=[^;]+$/.test(selectedSession))throw new Error('Missing or invalid courierCookie in this collection. Run its login step first.');
      pm.variables.set('courierCookie',selectedSession);
      pm.request.headers.upsert({key:'Cookie',value:selectedSession});
  - type: afterResponse
    code: |-
      const b=pm.response.code===200?pm.response.json():null;
      const key='retry:'+pm.info.requestName;
      const n=Number(pm.collectionVariables.get(key)||0);
      if((!b||b.availableCredit!==120||b.reserveCredit!==0)&&n<45){pm.collectionVariables.set(key,String(n+1));pm.execution.setNextRequest(pm.info.requestName);}else{pm.collectionVariables.unset(key);
      pm.test('balance returned',()=>pm.response.to.have.status(200));
      if(b){pm.test('correct user',()=>pm.expect(b.userId).to.eql(pm.collectionVariables.get('courierSub')));pm.test('available = 120',()=>pm.expect(b.availableCredit).to.eql(120));pm.test('reserved = 0',()=>pm.expect(b.reserveCredit).to.eql(0));}
      }
settings: {}
order: 11000
