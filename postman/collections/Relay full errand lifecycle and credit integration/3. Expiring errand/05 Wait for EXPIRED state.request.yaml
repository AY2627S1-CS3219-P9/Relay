$kind: http-request
description: ''
url: '{{baseUrl}}/api/errands/{{expiryId}}'
method: GET
headers:
  Cookie: '{{requesterCookie}}'
scripts:
  - type: beforeRequest
    code: |-
      const selectedSession=pm.collectionVariables.get('requesterCookie');
      if(typeof selectedSession!=='string'||!/^relay_access=[^;]+; relay_id=[^;]+$/.test(selectedSession))throw new Error('Missing or invalid requesterCookie in this collection. Run its login step first.');
      pm.variables.set('requesterCookie',selectedSession);
      pm.request.headers.upsert({key:'Cookie',value:selectedSession});
  - type: beforeRequest
    code: |-
      const retryKey='retry:'+pm.info.requestName;
      if(Number(pm.collectionVariables.get(retryKey)||0)>0)setTimeout(()=>{},1000);
  - type: afterResponse
    code: |-
      const e=pm.response.code===200?pm.response.json().errand:null;
      const key='retry:'+pm.info.requestName;
      const n=Number(pm.collectionVariables.get(key)||0);
      if((!e||e.status!=='EXPIRED')&&n<50){pm.collectionVariables.set(key,String(n+1));pm.execution.setNextRequest(pm.info.requestName);}else{pm.collectionVariables.unset(key);
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      if(e)pm.test('status EXPIRED',()=>pm.expect(e.status).to.eql('EXPIRED'));
      }
settings: {}
order: 5000
