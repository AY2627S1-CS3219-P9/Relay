$kind: http-request
description: ''
url: '{{baseUrl}}/api/credit/history?offset=0'
queryParams:
  offset: '0'
method: GET
headers:
  Cookie: '{{courierCookie}}'
scripts:
  - type: beforeRequest
    code: |-
      const selectedSession=pm.collectionVariables.get('courierCookie');
      if(typeof selectedSession!=='string'||!/^relay_access=[^;]+; relay_id=[^;]+$/.test(selectedSession))throw new Error('Missing or invalid courierCookie in this collection. Run its login step first.');
      pm.variables.set('courierCookie',selectedSession);
      pm.request.headers.upsert({key:'Cookie',value:selectedSession});
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      const records=pm.response.json().records;
      pm.test('records returned',()=>pm.expect(records).to.be.an('array'));
      pm.test('CREDIT_TRANSFER recorded for errand',()=>pm.expect(records.some(r=>r.reference?.id===pm.collectionVariables.get('completeId')&&r.type==='CREDIT_TRANSFER')).to.eql(true));
settings: {}
order: 4000
