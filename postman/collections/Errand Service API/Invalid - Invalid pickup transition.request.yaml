$kind: http-request
method: POST
url: "{{baseUrl}}/api/errands/{{errandId}}/pickup"
order: 16000
headers:
  Content-Type: application/json
  Cookie: relay_access={{sessionCookieCourier}}; relay_id={{idCookieCourier}}
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('Cannot pick up non-ACCEPTED errand', () => {
        pm.response.to.have.status(409);
      });

      const json = pm.response.json();
      pm.test('Error code is INVALID_TRANSITION', () => {
        pm.expect(json.code).to.eql('INVALID_TRANSITION');
      });
      pm.test('Error message is correct', () => {
        pm.expect(json.message).to.include('Errand was not in expected state: Accepted.');
      });
    language: text/javascript
