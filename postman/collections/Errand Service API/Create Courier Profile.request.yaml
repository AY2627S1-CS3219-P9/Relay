$kind: http-request
method: PATCH
url: "{{baseUrl}}/api/user/me"
order: 10000
headers:
  Content-Type: application/json
  Cookie: relay_access={{sessionCookieCourier}}; relay_id={{idCookieCourier}}
body:
  type: json
  content: |-
    {
      "username": "{{courierUsername}}",
      "profilePicture": null
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Courier profile created', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().ok).to.be.true;
      });
    language: text/javascript
