$kind: http-request
method: GET
url: "{{baseUrl}}/api/errands?scope=mine"
queryParams:
  scope: mine
order: 28000
headers:
  Cookie: relay_access={{sessionCookie}}; relay_id={{idCookie}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Requester errands retrieved', () => {
        pm.response.to.have.status(200);
      });
    language: text/javascript
