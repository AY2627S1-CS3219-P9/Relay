$kind: http-request
method: POST
url: '{{baseUrl}}/api/errands/{{errandId2}}/accept'
order: 27000
headers:
  Content-Type: application/json
  Cookie: relay_access={{sessionCookie}}; relay_id={{idCookie}}
body:
  type: json
  content: ''
scripts:
  - type: beforeRequest
    code: |-
      const access=pm.collectionVariables.get('sessionCookie');
      const id=pm.collectionVariables.get('idCookie');
      if(!access||!id)throw new Error('Run the matching login request before this request.');
      pm.request.headers.upsert({key:'Cookie',value:'relay_access='+access+'; relay_id='+id});
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Requester cannot accept own errand', () => {
        pm.response.to.have.status(403);
      });

      const json = pm.response.json();
      pm.test('Error code is FORBIDDEN', () => {
        pm.expect(json.code).to.eql('FORBIDDEN');
      });
      pm.test('Error message is correct', () => {
        pm.expect(json.message).to.include('requester');
      });
    language: text/javascript
