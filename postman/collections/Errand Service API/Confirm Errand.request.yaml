$kind: http-request
method: POST
url: '{{baseUrl}}/api/errands/{{errandId}}/confirm'
order: 23000
headers:
  Content-Type: application/json
  Cookie: relay_access={{sessionCookie}}; relay_id={{idCookie}}
body:
  type: json
  content: ''
scripts:
  - type: beforeRequest
    code: |-
      const access=pm.collectionVariables.get('sessionCookie');
      const id=pm.collectionVariables.get('idCookie');
      if(!access||!id)throw new Error('Run the matching login request before this request.');
      pm.request.headers.upsert({key:'Cookie',value:'relay_access='+access+'; relay_id='+id});
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Errand confirmed', () => {
        pm.response.to.have.status(200);
      });

      const json = pm.response.json();
      pm.test('Errand status is CONFIRMED', () => {
        pm.expect(json.errand.status).to.eql('CONFIRMED');
      });
      console.log('SUCCESS: Errand workflow completed!');
    language: text/javascript
