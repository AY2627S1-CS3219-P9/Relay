$kind: http-request
method: POST
url: '{{baseUrl}}/api/errands/{{errandId}}/deliver'
order: 21000
headers:
  Content-Type: application/json
  Cookie: relay_access={{sessionCookieCourier}}; relay_id={{idCookieCourier}}
body:
  type: json
  content: ''
scripts:
  - type: beforeRequest
    code: |-
      const access=pm.collectionVariables.get('sessionCookieCourier');
      const id=pm.collectionVariables.get('idCookieCourier');
      if(!access||!id)throw new Error('Run the matching login request before this request.');
      pm.request.headers.upsert({key:'Cookie',value:'relay_access='+access+'; relay_id='+id});
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Errand delivered', () => {
        pm.response.to.have.status(200);
      });

      const json = pm.response.json();
      pm.test('Errand status is DELIVERED', () => {
        pm.expect(json.errand.status).to.eql('DELIVERED');
      });
    language: text/javascript
