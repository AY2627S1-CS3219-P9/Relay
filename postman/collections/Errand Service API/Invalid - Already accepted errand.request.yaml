$kind: http-request
method: POST
url: '{{baseUrl}}/api/errands/{{errandId}}/accept'
order: 17000
headers:
  Content-Type: application/json
  Cookie: relay_session={{sessionCookieCourier}}
body:
  type: json
  content: ''
scripts:
  - type: afterResponse
    code: |-
      pm.test('Cannot accept already-accepted errand', () => {
        pm.response.to.have.status(409);
      });

      const json = pm.response.json();
      pm.test('Error code is CONFLICT', () => {
        pm.expect(json.code).to.eql('CONFLICT');
      });
      pm.test('Error message is correct', () => {
        pm.expect(json.message).to.include('already');
      });
    language: text/javascript
