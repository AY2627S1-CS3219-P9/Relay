$kind: http-request
method: POST
url: "{{baseUrl}}/api/errands/{{errandId}}/accept"
order: 18000
headers:
  Content-Type: application/json
  Cookie: relay_access={{sessionCookieCourier}}; relay_id={{idCookieCourier}}
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('Cannot accept already-accepted errand', () => {
        pm.response.to.have.status(409);
      });

      const json = pm.response.json();
      pm.test('Error code is CONFLICT', () => {
        pm.expect(json.code).to.eql('INVALID_TRANSITION');
      });
      pm.test('Error message is correct', () => {
        pm.expect(json.message).to.include('Errand is already accepted by a courier.');
      });
    language: text/javascript
