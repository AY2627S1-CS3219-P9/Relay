$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/verification/confirm-and-login'
order: 5000
description: Confirm signup with verification code and login
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{requesterEmail}}",
      "password": "{{requesterPassword}}",
      "code": "{{requesterVerificationCode}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Verification accepted', () => {
        pm.response.to.have.status(200);
      });

      const json = pm.response.json();
      const cookies = pm.response.headers.all().filter(header => header.key.toLowerCase() === 'set-cookie').map(header => header.value.split(';')[0]);
      const access = cookies.find(cookie => cookie.startsWith('relay_access='))?.slice('relay_access='.length);
      const id = cookies.find(cookie => cookie.startsWith('relay_id='))?.slice('relay_id='.length);
      const refresh = cookies.find(cookie => cookie.startsWith('relay_refresh='))?.slice('relay_refresh='.length);
      pm.test('Cognito cookies returned', () => {
        pm.expect(access).to.be.a('string').and.not.empty;
        pm.expect(id).to.be.a('string').and.not.empty;
        pm.expect(refresh).to.be.a('string').and.not.empty;
      });
      pm.collectionVariables.set('sessionCookie', access);
      pm.collectionVariables.set('idCookie', id);
      pm.collectionVariables.set('refreshCookie', refresh);
      pm.collectionVariables.set('requesterSub', json.data.user.subject);
    language: text/javascript
