$kind: http-request
method: POST
url: '{{baseUrl}}/api/errands/{{errandId}}/pickup'
order: 18000
headers:
  Content-Type: application/json
  Cookie: relay_session={{sessionCookieCourier}}
body:
  type: json
  content: ''
scripts:
  - type: afterResponse
    code: |-
      pm.test('Errand picked up', () => {
        pm.response.to.have.status(200);
      });

      const json = pm.response.json();
      pm.test('Errand status is PICKED_UP', () => {
        pm.expect(json.errand.status).to.eql('PICKED_UP');
      });
    language: text/javascript
