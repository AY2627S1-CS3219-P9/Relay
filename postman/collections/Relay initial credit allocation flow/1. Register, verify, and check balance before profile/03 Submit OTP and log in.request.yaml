$kind: http-request
url: "{{baseUrl}}/api/auth/verification/confirm-and-login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":"{{testEmail}}","password":"{{testPassword}}","code":"{{verificationCode}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('verification accepted',()=>pm.response.to.have.status(200));
      pm.test('verified Cognito identity returned',()=>{pm.expect(pm.response.json().data.user.subject).to.be.a('string').and.not.empty;pm.expect(pm.response.json().data.user.emailVerified).to.eql(true);});
      pm.collectionVariables.set('cognitoSub',pm.response.json().data.user.subject);
      const cookie=pm.response.headers.all().filter(h=>h.key.toLowerCase()==='set-cookie').map(h=>h.value.split(';')[0]).filter(x=>x.startsWith('relay_access=')||x.startsWith('relay_id=')).join('; ');
      pm.test('session cookie returned',()=>pm.expect(cookie).to.include('relay_access='));
      if(cookie)pm.collectionVariables.set('sessionCookie',cookie);
      const refreshCookie=pm.response.headers.all().filter(h=>h.key.toLowerCase()==='set-cookie').map(h=>h.value.split(';')[0]).find(x=>x.startsWith('relay_refresh='));
      pm.test('Cognito access, ID and refresh cookies returned',()=>{pm.expect(pm.collectionVariables.get('sessionCookie')).to.match(/^relay_access=[^;]+; relay_id=[^;]+$/);pm.expect(refreshCookie).to.match(/^relay_refresh=[^;]+$/);});
      if(refreshCookie)pm.collectionVariables.set('sessionRefreshCookie',refreshCookie);
settings: {}
order: 3000
