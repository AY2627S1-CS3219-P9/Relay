$kind: http-request
method: POST
url: '{{baseUrl}}/api/supplier'
order: 24000
headers:
  Content-Type: application/json
  Cookie: relay_access={{sessionCookie}}; relay_id={{idCookie}}
body:
  type: json
  content: |-
    {
      "name": "Test Supplier",
      "location": {
        "lng": 103.7764,
        "buildingName": "Test Building",
        "floorNumber": 1
      },
      "isOperational": true,
      "operatingHours": {
        "openingTime": "09:00",
        "closingTime": "18:00",
        "daysOfWeek": [1, 2, 3, 4, 5]
      },
      "serviceTypes": [0]
    }
scripts:
  - type: beforeRequest
    code: |-
      const access=pm.collectionVariables.get('sessionCookie');
      const id=pm.collectionVariables.get('idCookie');
      if(!access||!id)throw new Error('Run the matching login request before this request.');
      pm.request.headers.upsert({key:'Cookie',value:'relay_access='+access+'; relay_id='+id});
    language: text/javascript
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test('Returns 400', () => {
        pm.response.to.have.status(400);
      });
      if (json.code) {
        pm.test('Error code is INVALID_REQUEST', () => {
          pm.expect(json.code).to.eql('INVALID_REQUEST');
        });
      }
    language: text/javascript
