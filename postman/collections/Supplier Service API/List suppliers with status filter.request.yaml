$kind: http-request
method: GET
url: '{{baseUrl}}/api/supplier?status=operational'
order: 4000
headers:
  Cookie: relay_access={{sessionCookie}}; relay_id={{idCookie}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('List suppliers with status=operational returns 200', () => {
        pm.response.to.have.status(200);
      });

      const json = pm.response.json();
      pm.test('Response contains suppliers array', () => {
        pm.expect(json.suppliers).to.be.an('array');
      });

      pm.test('All returned suppliers are operational', () => {
        json.suppliers.forEach((supplier) => {
          pm.expect(supplier.isOperational).to.be.true;
        });
      });
    language: text/javascript
