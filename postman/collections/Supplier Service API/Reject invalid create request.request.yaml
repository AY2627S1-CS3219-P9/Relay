$kind: http-request
method: POST
url: '{{baseUrl}}/api/supplier'
order: 23000
headers:
  Content-Type: application/json
  Cookie: relay_access={{sessionCookie}}; relay_id={{idCookie}}
body:
  type: json
  content: |-
    {}
scripts:
  - type: beforeRequest
    code: |-
      const access=pm.collectionVariables.get('sessionCookie');
      const id=pm.collectionVariables.get('idCookie');
      if(!access||!id)throw new Error('Run the matching login request before this request.');
      pm.request.headers.upsert({key:'Cookie',value:'relay_access='+access+'; relay_id='+id});
    language: text/javascript
  - type: afterResponse
    code: |-
      const json = pm.response.json();

      pm.test('Invalid create returns 400', () => {
        pm.response.to.have.status(400);
      });

      if (json.message) {
        pm.test('Error message is "Name is required"', () => {
          pm.expect(json.message).to.eql('Name is required');
        });
      }
    language: text/javascript
