$kind: http-request
method: GET
url: '{{baseUrl}}/api/supplier?status=operational&serviceTypes=[0]'
order: 6000
headers:
  Cookie: relay_session={{sessionCookie}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('List suppliers with combined filters returns 200', () => {
        pm.response.to.have.status(200);
      });

      const json = pm.response.json();
      pm.test('Response contains suppliers array', () => {
        pm.expect(json.suppliers).to.be.an('array');
      });

      pm.test('All returned suppliers are operational and have Food', () => {
        json.suppliers.forEach((supplier) => {
          pm.expect(supplier.isOperational).to.be.true;
          pm.expect(supplier.serviceTypes).to.include(0);
        });
      });
    language: text/javascript
