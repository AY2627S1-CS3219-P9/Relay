$kind: http-request
method: GET
url: '{{baseUrl}}/api/supplier/{{supplierId}}'
order: 18000
headers:
  Cookie: relay_session={{sessionCookie}}
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();

      pm.test('Get supplier returns 200', () => {
        pm.response.to.have.status(200);
      });

      if (json.supplier) {
        pm.test('Supplier id matches', () => {
          pm.expect(json.supplier.id).to.eql(pm.collectionVariables.get('supplierId'));
        });
      }
    language: text/javascript
