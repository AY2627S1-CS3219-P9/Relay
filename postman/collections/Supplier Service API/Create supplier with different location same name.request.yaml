$kind: http-request
method: POST
url: "{{baseUrl}}/api/supplier"
order: 15000
headers:
  Content-Type: application/json
  Cookie: relay_session={{sessionCookie}}
body:
  type: json
  content: |-
    {
      "name": "Postman Test Supplier",
      "location": {
        "lat": 1.3000,
        "lng": 103.7800,
        "buildingName": "Different Building",
        "floorNumber": 2
      },
      "isOperational": true,
      "operatingHours": {
        "openingTime": "09:00",
        "closingTime": "18:00",
        "daysOfWeek": [1, 2, 3, 4, 5]
      },
      "serviceTypes": [0]
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test('Same name with different location should be accepted', () => {
        pm.response.to.have.status(201);
      });
      if (json.supplier && json.supplier.id) {
        pm.collectionVariables.set('supplierId3', json.supplier.id);
      }
    language: text/javascript
