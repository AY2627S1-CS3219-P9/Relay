$kind: http-request
method: POST
url: '{{baseUrl}}/api/supplier'
order: 10000
headers:
  Content-Type: application/json
  Cookie: relay_access={{sessionCookie}}; relay_id={{idCookie}}
body:
  type: json
  content: |-
    {
      "name": "Postman Test Supplier",
      "location": {
        "lat": 1.2966,
        "lng": 103.7764,
        "buildingName": "Postman Test Building",
        "floorNumber": 1
      },
      "isOperational": true,
      "operatingHours": {
        "openingTime": "09:00",
        "closingTime": "18:00",
        "daysOfWeek": [1, 2, 3, 4, 5]
      },
      "serviceTypes": [0]
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();

      pm.test('Duplicate create returns 409', () => {
        pm.response.to.have.status(409);
      });

      if (json.code) {
        pm.test('Error code is DUPLICATE_SUPPLIER', () => {
          pm.expect(json.code).to.eql('DUPLICATE_SUPPLIER');
        });
      }
    language: text/javascript
