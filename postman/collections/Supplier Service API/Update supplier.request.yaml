$kind: http-request
method: PUT
url: '{{baseUrl}}/api/supplier/{{supplierId}}'
order: 19000
headers:
  Content-Type: application/json
  Cookie: relay_access={{sessionCookie}}; relay_id={{idCookie}}
body:
  type: json
  content: |-
    {
      "name": "{{supplierUpdatedName}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const access=pm.collectionVariables.get('sessionCookie');
      const id=pm.collectionVariables.get('idCookie');
      if(!access||!id)throw new Error('Run the matching login request before this request.');
      pm.request.headers.upsert({key:'Cookie',value:'relay_access='+access+'; relay_id='+id});
    language: text/javascript
  - type: afterResponse
    code: |-
      const json = pm.response.json();

      pm.test('Update supplier returns 200', () => {
        pm.response.to.have.status(200);
      });

      if (json.supplier) {
        pm.test('Supplier name is updated', () => {
          pm.expect(json.supplier.name).to.eql(pm.collectionVariables.get('supplierUpdatedName'));
        });
      }
    language: text/javascript
