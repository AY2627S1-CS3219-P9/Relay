$kind: http-request
method: GET
url: '{{baseUrl}}/api/supplier/{{supplierId}}'
order: 21000
headers:
  Cookie: relay_access={{sessionCookie}}; relay_id={{idCookie}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Get deleted supplier returns 404', () => {
        pm.response.to.have.status(404);
      });
    language: text/javascript
