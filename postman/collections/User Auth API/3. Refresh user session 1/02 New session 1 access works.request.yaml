$kind: http-request
method: GET
url: '{{baseUrl}}/api/auth/me'
order: 2000
scripts:
  - type: beforeRequest
    code: |-
      pm.request.headers.upsert({key:'Cookie',value:'relay_access='+pm.collectionVariables.get('s1NewAccess')+'; relay_id='+pm.collectionVariables.get('s1NewId')});
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
settings: {}
