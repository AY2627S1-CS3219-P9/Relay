$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 8000
headers:
  Content-Type: 'application/json'
body:
  type: json
  content: '{"email":"{{bootstrapAdminEmail}}","password":"{{bootstrapAdminPassword}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      const c=pm.response.headers.all().filter(h=>h.key.toLowerCase()==='set-cookie').map(h=>h.value.split(';')[0]);
      for(const name of ['Access','Id','Refresh']){
        const key='relay_'+name.toLowerCase(), value=c.find(x=>x.startsWith(key+'='));
        pm.test(key+' cookie present',()=>pm.expect(value).to.match(new RegExp('^'+key+'=.+')));
        if(value)pm.collectionVariables.set('admin'+name,value.split('=')[1]);
      }

      pm.test('super admin role',()=>pm.expect(pm.response.json().data.user.role).to.eql('super-admin'));
settings: {}
