$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/password'
order: 3000
headers:
  Content-Type: 'application/json'
body:
  type: json
  content: '{"currentPassword":"{{password}}","newPassword":"{{newPassword}}","newPasswordConfirmation":"Different123!"}'
scripts:
  - type: beforeRequest
    code: |-
      pm.request.headers.upsert({key:'Cookie',value:'relay_access='+pm.collectionVariables.get('s2Access')+'; relay_id='+pm.collectionVariables.get('s2Id')});
  - type: afterResponse
    code: |-
      pm.test('HTTP 400',()=>pm.response.to.have.status(400));
      pm.test('VALIDATION_FAILED',()=>pm.expect(pm.response.json().error.code).to.eql('VALIDATION_FAILED'));
settings: {}
