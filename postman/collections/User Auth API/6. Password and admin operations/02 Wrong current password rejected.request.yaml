$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/password'
order: 2000
headers:
  Content-Type: 'application/json'
body:
  type: json
  content: '{"currentPassword":"Wrong1234!","newPassword":"{{newPassword}}","newPasswordConfirmation":"{{newPassword}}"}'
scripts:
  - type: beforeRequest
    code: |-
      pm.request.headers.upsert({key:'Cookie',value:'relay_access='+pm.collectionVariables.get('s2Access')+'; relay_id='+pm.collectionVariables.get('s2Id')});
  - type: afterResponse
    code: |-
      pm.test('HTTP 401',()=>pm.response.to.have.status(401));
      pm.test('INVALID_CREDENTIALS',()=>pm.expect(pm.response.json().error.code).to.eql('INVALID_CREDENTIALS'));
settings: {}
