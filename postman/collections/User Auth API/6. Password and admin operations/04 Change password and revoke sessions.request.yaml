$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/password'
order: 4000
headers:
  Content-Type: 'application/json'
body:
  type: json
  content: '{"currentPassword":"{{password}}","newPassword":"{{newPassword}}","newPasswordConfirmation":"{{newPassword}}"}'
scripts:
  - type: beforeRequest
    code: |-
      pm.request.headers.upsert({key:'Cookie',value:'relay_access='+pm.collectionVariables.get('s2Access')+'; relay_id='+pm.collectionVariables.get('s2Id')});
  - type: afterResponse
    code: |-
      pm.test('HTTP 204',()=>pm.response.to.have.status(204));
settings: {}
