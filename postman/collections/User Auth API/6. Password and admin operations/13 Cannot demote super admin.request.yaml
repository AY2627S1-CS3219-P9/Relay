$kind: http-request
method: POST
url: "{{baseUrl}}/api/auth/admin/demote"
order: 13000
headers:
  Content-Type: "application/json"
body:
  type: json
  content: "{\"email\":\"{{bootstrapAdminEmail}}\"}"
scripts:
  - type: beforeRequest
    code: |- 
      pm.request.headers.upsert({key:'Cookie',value:'relay_access='+pm.collectionVariables.get('adminAccess')+'; relay_id='+pm.collectionVariables.get('adminId')});
  - type: afterResponse
    code: |- 
      pm.test('HTTP 403',()=>pm.response.to.have.status(403));
      pm.test('FORBIDDEN',()=>pm.expect(pm.response.json().error.code).to.eql('FORBIDDEN'));
settings: {}
