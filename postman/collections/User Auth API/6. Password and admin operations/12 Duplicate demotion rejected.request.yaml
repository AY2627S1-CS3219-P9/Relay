$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/admin/demote'
order: 12000
headers:
  Content-Type: 'application/json'
body:
  type: json
  content: '{"email":"{{email}}"}'
scripts:
  - type: beforeRequest
    code: |-
      pm.request.headers.upsert({key:'Cookie',value:'relay_access='+pm.collectionVariables.get('adminAccess')+'; relay_id='+pm.collectionVariables.get('adminId')});
  - type: afterResponse
    code: |-
      pm.test('HTTP 409',()=>pm.response.to.have.status(409));
      pm.test('NOT_ADMIN',()=>pm.expect(pm.response.json().error.code).to.eql('NOT_ADMIN'));
settings: {}
