$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/refresh'
order: 3000
scripts:
  - type: beforeRequest
    code: |-
      pm.request.headers.upsert({key:'Cookie',value:'relay_refresh='+pm.collectionVariables.get('s2NewRefresh')});
  - type: afterResponse
    code: |-
      pm.test('HTTP 401',()=>pm.response.to.have.status(401));
      pm.test('INVALID_CREDENTIALS',()=>pm.expect(pm.response.json().error.code).to.eql('INVALID_CREDENTIALS'));
settings: {}
