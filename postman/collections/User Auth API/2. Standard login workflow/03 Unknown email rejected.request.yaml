$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 3000
headers:
  Content-Type: 'application/json'
body:
  type: json
  content: '{"email":"unknown-{{email}}","password":"{{password}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 401',()=>pm.response.to.have.status(401));
      pm.test('INVALID_CREDENTIALS',()=>pm.expect(pm.response.json().error.code).to.eql('INVALID_CREDENTIALS'));
settings: {}
