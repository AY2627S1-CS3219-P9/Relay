$kind: http-request
method: POST
url: "{{baseUrl}}/api/auth/login"
order: 6000
headers:
  Content-Type: "application/json"
body:
  type: json
  content: "{\"email\":\"{{email}}\"}"
scripts:
  - type: afterResponse
    code: |- 
      pm.test('HTTP 400',()=>pm.response.to.have.status(400));
      pm.test('VALIDATION_FAILED',()=>pm.expect(pm.response.json().error.code).to.eql('VALIDATION_FAILED'));
settings: {}
