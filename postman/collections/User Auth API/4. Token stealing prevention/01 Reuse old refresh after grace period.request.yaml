$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/refresh'
order: 1000
scripts:
  - type: beforeRequest
    code: |-
      setTimeout(()=>{},11000);
      pm.request.headers.upsert({key:'Cookie',value:'relay_refresh='+pm.collectionVariables.get('s1OldRefresh')});
  - type: afterResponse
    code: |-
      if(pm.environment.get('target_env')==='development'){
        console.warn('Floci limitation: the old refresh token remains usable after the 10-second grace period; token theft is not detected or revoked locally.');
        pm.test('Floci accepts old refresh token after grace period (known limitation)',()=>pm.response.to.have.status(200));
        pm.test('Floci returns auth cookies',()=>pm.expect(pm.response.headers.all().some(h=>h.key.toLowerCase()==='set-cookie'&&h.value.startsWith('relay_refresh='))).to.eql(true));
      }else{
        pm.test('Stolen refresh token rejected',()=>pm.response.to.have.status(401));
        if(pm.response.code===401)pm.test('INVALID_CREDENTIALS',()=>pm.expect(pm.response.json().error?.code).to.eql('INVALID_CREDENTIALS'));
      }
settings: {}
