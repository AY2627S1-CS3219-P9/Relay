$kind: http-request
method: POST
url: "{{baseUrl}}/api/auth/register"
order: 15000
headers:
  Content-Type: "application/json"
body:
  type: json
  content: "{\"email\":\"{{email}}\",\"password\":\"{{password}}\",\"passwordConfirmation\":\"{{password}}\"}"
scripts:
  - type: afterResponse
    code: |- 
      pm.test('HTTP 409',()=>pm.response.to.have.status(409));
      pm.test('EMAIL_ALREADY_REGISTERED',()=>pm.expect(pm.response.json().error.code).to.eql('EMAIL_ALREADY_REGISTERED'));
settings: {}
