$kind: http-request
method: POST
url: "{{baseUrl}}/api/auth/register"
order: 2006
headers:
  Content-Type: "application/json"
body:
  type: json
  content: "{\"email\":\"{{email}}\",\"password\":\"Abcdefg12\",\"passwordConfirmation\":\"Abcdefg12\"}"
scripts:
  - type: afterResponse
    code: |- 
      pm.test('HTTP 400',()=>pm.response.to.have.status(400));
      pm.test('VALIDATION_FAILED',()=>pm.expect(pm.response.json().error.code).to.eql('VALIDATION_FAILED'));
      pm.test('password field error',()=>pm.expect(pm.response.json().error.fieldErrors).to.have.property('password'));
settings: {}
