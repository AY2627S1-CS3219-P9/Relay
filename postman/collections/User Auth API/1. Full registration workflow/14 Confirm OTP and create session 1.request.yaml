$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/verification/confirm-and-login'
order: 14000
headers:
  Content-Type: 'application/json'
body:
  type: json
  content: '{"email":"{{email}}","password":"{{password}}","code":"{{otp}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      const user=pm.response.json().data.user;
      pm.test('verified user identity',()=>{pm.expect(user.email).to.eql(pm.collectionVariables.get('email'));pm.expect(user.emailVerified).to.eql(true);pm.expect(user.role).to.eql('user');pm.expect(user.subject).to.be.a('string');});
      pm.collectionVariables.set('sub',user.subject);

      const c=pm.response.headers.all().filter(h=>h.key.toLowerCase()==='set-cookie').map(h=>h.value.split(';')[0]);
      const rawCookies=pm.response.headers.all().filter(h=>h.key.toLowerCase()==='set-cookie').map(h=>h.value);
      pm.test('secure HttpOnly SameSite cookies with correct paths',()=>{
        for(const name of ['relay_access','relay_id','relay_refresh']){
          const cookie=rawCookies.find(value=>value.startsWith(name+'='));
          pm.expect(cookie).to.include('HttpOnly').and.include('SameSite=Strict').and.include('Secure');
          pm.expect(cookie).to.include(name==='relay_refresh'?'Path=/api/auth':'Path=/');
          if(name!=='relay_refresh')pm.expect(cookie).to.include('Max-Age=900');
        }
      });
      for(const name of ['Access','Id','Refresh']){
        const key='relay_'+name.toLowerCase(), value=c.find(x=>x.startsWith(key+'='));
        pm.test(key+' cookie present',()=>pm.expect(value).to.match(new RegExp('^'+key+'=.+')));
        if(value)pm.collectionVariables.set('s1'+name,value.split('=')[1]);
      }
settings: {}
