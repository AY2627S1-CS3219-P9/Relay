$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/register'
order: 3100
headers:
  Content-Type: 'application/json'
body:
  type: json
  content: '{"email":"","password":"{{password}}","passwordConfirmation":"{{password}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400',()=>pm.response.to.have.status(400));
      pm.test('VALIDATION_FAILED',()=>pm.expect(pm.response.json().error.code).to.eql('VALIDATION_FAILED'));
      pm.test('email field error',()=>pm.expect(pm.response.json().error.fieldErrors).to.have.property('email'));
settings: {}
