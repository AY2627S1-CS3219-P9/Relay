$kind: http-request
url: '{{baseUrl}}/api/auth/login'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":"{{superAdminEmail}}","password":"{{superAdminPassword}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.test('super admin role',()=>pm.expect(pm.response.json().data.user.role).to.eql('super-admin'));
      const c=pm.response.headers.all().filter(h=>h.key.toLowerCase()==='set-cookie').map(h=>h.value.split(';')[0]).filter(x=>x.startsWith('relay_access=')||x.startsWith('relay_id=')).join('; '); pm.test('access cookie',()=>pm.expect(c).to.include('relay_access=')); if(c)pm.collectionVariables.set('superAdminCookie',c);
      const refreshCookie=pm.response.headers.all().filter(h=>h.key.toLowerCase()==='set-cookie').map(h=>h.value.split(';')[0]).find(x=>x.startsWith('relay_refresh='));
      pm.test('Cognito access, ID and refresh cookies returned',()=>{pm.expect(pm.collectionVariables.get('superAdminCookie')).to.match(/^relay_access=[^;]+; relay_id=[^;]+$/);pm.expect(refreshCookie).to.match(/^relay_refresh=[^;]+$/);});
      if(refreshCookie)pm.collectionVariables.set('superAdminRefreshCookie',refreshCookie);
settings: {}
order: 1000
