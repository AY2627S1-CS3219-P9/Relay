$kind: http-request
url: "{{baseUrl}}/api/user/me"
method: PATCH
headers:
  Content-Type: application/json
  Cookie: "{{superAdminCookie}}"
body:
  type: json
  content: '{"username":"{{superAdminUsername}}"}'
scripts:
  - type: beforeRequest
    code: |-
      const selectedCookie=pm.collectionVariables.get('superAdminCookie');
      if(typeof selectedCookie!=='string'||!/^relay_access=[^;]+; relay_id=[^;]+$/.test(selectedCookie))throw new Error('Missing or invalid superAdminCookie in this collection. Run its sign-in step first.');
      pm.variables.set('superAdminCookie',selectedCookie);
      pm.request.headers.upsert({key:'Cookie',value:selectedCookie});
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.test('profile created',()=>pm.expect(pm.response.json().data.profileCreated).to.eql(true));
settings: {}
order: 3000
