$kind: http-request
url: "{{baseUrl}}/api/supplier"
method: POST
headers:
  Content-Type: application/json
  Cookie: "{{normalCookie}}"
body:
  type: json
  content: '{"name":"{{supplierName}}","location":{"lat":1.3,"lng":103.8,"buildingName":"Postman Test Building","floorNumber":1},"isOperational":true,"operatingHours":{"openingTime":"09:00","closingTime":"18:00","daysOfWeek":[0,1,2,3,4]},"serviceTypes":[0,1]}'
scripts:
  - type: beforeRequest
    code: |-
      const selectedCookie=pm.collectionVariables.get('normalCookie');
      if(typeof selectedCookie!=='string'||!/^relay_access=[^;]+; relay_id=[^;]+$/.test(selectedCookie))throw new Error('Missing or invalid normalCookie in this collection. Run its sign-in step first.');
      pm.variables.set('normalCookie',selectedCookie);
      pm.request.headers.upsert({key:'Cookie',value:selectedCookie});
  - type: afterResponse
    code: pm.test('HTTP 403',()=>pm.response.to.have.status(403));
settings: {}
order: 11000
