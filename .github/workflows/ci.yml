name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build workspaces
        run: npm run build

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build and start the Compose environment
        run: docker compose up --build --detach --wait

      - name: Run tests
        env:
          CREDIT_SERVICE_INTERNAL_TOKEN: local-internal-credit-service-token
          KAFKA_BROKERS: localhost:29092
          KAFKA_TOPIC_USER_EVENTS: user-events
          KAFKA_TOPIC_USER_DLQ: user-events-dlq
          KAFKA_TOPIC_ERRAND_EVENTS: errand-events
          KAFKA_TOPIC_ERRAND_DLQ: errand-events-dlq
        run: npm test

      - name: Collect Compose diagnostics
        if: failure()
        run: |
          docker compose ps -a > compose-ps.txt
          docker compose logs --no-color > compose-logs.txt

      - name: Upload Compose diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-diagnostics
          path: |
            compose-ps.txt
            compose-logs.txt

      - name: Stop the Compose environment
        if: always()
        run: docker compose down --volumes --remove-orphans
