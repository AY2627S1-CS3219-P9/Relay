# Scope: Updated CI with new npm run compose:up command
# Author review: Verified correctness and CI was run on GitHub

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-config:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify portable deployment configuration
        run: node --test tests/deployment/*.test.mjs

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PARALLEL_LIMIT: '2'
      COMPOSE_PROJECT_NAME: relay
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared authentication middleware
        run: npm run build --workspace=@relay/user-auth-backend-middleware

      - name: Run lint
        run: npm run lint

      - name: Build workspaces
        run: npm run build

      - name: Start Compose with Floci
        run: npm run up:compose

      - name: Wait for the application
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Compose application did not become healthy" >&2
          exit 1

      - name: Run workspace and application tests
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source floci/docker/.generated.env
          set +a
          export USER_TEST_DATABASE_URL="$USER_DATABASE_URL_HOST"
          export ERRAND_TEST_DATABASE_URL="$ERRAND_DATABASE_URL_HOST"
          export CREDIT_TEST_DATABASE_URL="$CREDIT_DATABASE_URL_HOST"
          export KAFKA_BROKERS="$KAFKA_BROKERS_HOST"
          export KAFKA_AUTH_MODE=none
          export CREDIT_SERVICE_INTERNAL_TOKEN=local-internal-credit-service-token
          export KAFKA_TOPIC_USER_EVENTS=user-events KAFKA_TOPIC_USER_DLQ=user-events-dlq
          export KAFKA_TOPIC_ERRAND_EVENTS=errand-events KAFKA_TOPIC_ERRAND_DLQ=errand-events-dlq
          npm test

      - name: Install Postman CLI
        run: curl -fsSL https://dl-cli.pstmn.io/install/unix.sh | sh

      - name: Run Postman collections against Compose
        shell: bash
        run: |
          set -euo pipefail
          for collection in postman/collections/*/; do
            [[ -f "${collection}.resources/definition.yaml" ]] || continue
            echo "Running Postman collection: $collection"
            postman collection run "$collection" --environment postman/environments/compose.environment.yaml
          done

      - name: Collect Compose diagnostics
        if: failure()
        run: |
          docker ps -a > compose-ps.txt
          for id in $(docker ps -aq --filter label=com.docker.compose.project=relay); do
            docker logs "$id" >> compose-logs.txt 2>&1 || true
          done
          docker logs relay-floci-1 >> compose-logs.txt 2>&1 || true

      - name: Upload Compose diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-diagnostics
          path: |
            compose-ps.txt
            compose-logs.txt
          if-no-files-found: ignore

      - name: Stop the Compose environment
        if: always()
        run: npm run down:compose
