services:
  floci:
    build: ./floci/
    environment:
      FLOCI_INIT_HOOKS_TIMEOUT_SECONDS: '120'
    ports:
      - '4566:4566'
    env_file:
      - .env.development
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ['CMD-SHELL', 'test -f /app/data/ready && /usr/local/bin/healthcheck.sh']
      interval: 10s
      timeout: 3s
      retries: 5

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - '127.0.0.1:8081:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: relay-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      kafka:
        condition: service_healthy

  host:
    env_file:
      - .env.development
  user-api:
    env_file:
      - .env.development
    ports:
      - '127.0.0.1:3001:3000' # User API for local Postman requests
    environment:
      PORT: 3000
      AUTH_MODE: cognito
      AWS_ENDPOINT_URL: http://floci:4566
      # Cognito tokens are issued using the browser-facing Floci URL.
      # The backend still uses the internal Floci hostname for JWKS retrieval.
      COGNITO_ISSUER: http://localhost:4566/us-east-1_test
      COGNITO_JWKS_URI: http://floci:4566/us-east-1_test/.well-known/jwks.json
    depends_on:
      floci:
        condition: service_healthy
  user-auth-api:
    env_file:
      - .env.development
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      COGNITO_ISSUER: http://localhost:4566/us-east-1_test
      COGNITO_JWKS_URI: http://floci:4566/us-east-1_test/.well-known/jwks.json
      COOKIE_SECURE: 'false'
    ports:
      - '127.0.0.1:3004:3000'
    depends_on:
      floci:
        condition: service_healthy
  credit-api:
    ports:
      - '127.0.0.1:3002:3000' # Credit API for local Postman requests

  user-prisma-studio:
    build:
      context: .
      dockerfile: user-service/backend/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://relay:relay@user-postgres:5432/relay?schema=public
    command:
      - npx
      - prisma
      - studio
      - --schema=user-service/backend/prisma/schema.prisma
      - --hostname=0.0.0.0
      - --port=5555
    ports:
      - '127.0.0.1:5555:5555'
    depends_on:
      user-postgres:
        condition: service_healthy

  errand-prisma-studio:
    build:
      context: .
      dockerfile: errand-service/backend/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://relay:relay@errand-postgres:5432/relay_errand?schema=public
    command:
      - npx
      - prisma
      - studio
      - --schema=errand-service/backend/prisma/schema.prisma
      - --hostname=0.0.0.0
      - --port=5555
    ports:
      - '127.0.0.1:5556:5555'
    depends_on:
      errand-postgres:
        condition: service_healthy

  credit-prisma-studio:
    build:
      context: .
      dockerfile: credit-service/backend/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://relay:relay@credit-postgres:5432/relay?schema=public
    command:
      - npx
      - prisma
      - studio
      - --schema=credit-service/backend/prisma/schema.prisma
      - --hostname=0.0.0.0
      - --port=5555
    ports:
      - '127.0.0.1:5557:5555'
    depends_on:
      credit-postgres:
        condition: service_healthy
