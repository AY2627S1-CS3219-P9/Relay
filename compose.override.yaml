services:
  floci:
    build: ./floci/
    environment:
      FLOCI_INIT_HOOKS_TIMEOUT_SECONDS: '120'
    ports:
      - '4566:4566'
    env_file:
      - .env.development
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ['CMD-SHELL', 'test -f /app/data/ready && /usr/local/bin/healthcheck.sh']
      interval: 10s
      timeout: 3s
      retries: 5

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - '127.0.0.1:8081:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: relay-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      kafka:
        condition: service_healthy

  host:
    env_file:
      - .env.development
  user-api:
    env_file:
      - .env.development
    ports:
      - '5555:5555' # For prisma studio
      - '127.0.0.1:3001:3000' # User API for local Postman requests
    environment:
      PORT: 3000
      AUTH_MODE: cognito
      AWS_ENDPOINT_URL: http://floci:4566
      # Cognito tokens are issued using the browser-facing Floci URL.
      # The backend still uses the internal Floci hostname for JWKS retrieval.
      COGNITO_ISSUER: http://localhost:4566/us-east-1_test
      COGNITO_JWKS_URI: http://floci:4566/us-east-1_test/.well-known/jwks.json
    depends_on:
      floci:
        condition: service_healthy
  credit-api:
    ports:
      - '127.0.0.1:3002:3000' # Credit API for local Postman requests
      - '127.0.0.1:5556:5555' # Credit Prisma Studio

  errand-api:
    ports:
      - '5557:5555' # Errand Prisma Studio
