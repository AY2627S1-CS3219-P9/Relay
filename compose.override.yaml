services:
  floci:
    build: ./floci/
    ports:
      - "4566:4566"
    env_file:
      - .env.development
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/data/ready && /usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 5
  host:
    env_file:
      - .env.development
  user-api:
    env_file:
      - .env.development
    environment:
      PORT: 3000
      AUTH_MODE: cognito
      AWS_ENDPOINT_URL: http://floci:4566
      # Cognito tokens are issued using the browser-facing Floci URL.
      # The backend still uses the internal Floci hostname for JWKS retrieval.
      COGNITO_ISSUER: http://localhost:4566/us-east-1_test
      COGNITO_JWKS_URI: http://floci:4566/us-east-1_test/.well-known/jwks.json
    depends_on:
      floci:
        condition: service_healthy
