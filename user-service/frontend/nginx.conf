server {
  listen 80;
  root /usr/share/nginx/html;
  # Vite fingerprints assets, while remoteEntry.js stays uncached.
  location ^~ /remotes/user/assets/ {
    rewrite ^/remotes/user/(.*)$ /$1 break;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ^~ /remotes/user/ {
    rewrite ^/remotes/user/(.*)$ /$1 break;
    try_files $uri =404;
  }
  location = /healthz { default_type text/plain; return 200 "ok\n"; }
  location / { try_files $uri $uri/ /index.html; }
}
